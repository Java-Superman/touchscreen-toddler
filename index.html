<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1863">
<title>Tiny Taps</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; touch-action: manipulation;
    background: radial-gradient(circle at 50% 30%, #4b2ab0 0%, #2a1863 55%, #160c3a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.5vh; padding: 16px;
  }
  /* drifting bubbles */
  .bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bubbles span {
    position: absolute; bottom: -12vmin; border-radius: 50%;
    border: .5vmin solid rgba(255,255,255,.35); background: rgba(255,255,255,.06);
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-120vh) translateX(4vmin); } }

  h1 {
    position: relative; z-index: 1; margin: 0; font-size: clamp(40px, 9vmin, 110px); letter-spacing: .03em;
    filter: drop-shadow(0 .6vmin 0 rgba(0,0,0,.3));
  }
  h1 span { display: inline-block; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.2vmin); } }

  .cards { position: relative; z-index: 1; display: flex; gap: 4vmin; width: min(1500px, 100%); justify-content: center; }
  .card {
    position: relative; flex: 1 1 0; max-width: 680px; aspect-ratio: 4 / 3; border-radius: 5vmin; overflow: hidden;
    text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    box-shadow: 0 1.6vmin 0 rgba(0,0,0,.28), 0 2.5vmin 6vmin rgba(0,0,0,.35);
    transition: transform .12s ease; animation: float 3.2s ease-in-out infinite;
    border: .7vmin solid rgba(255,255,255,.85);
  }
  .card:nth-child(2) { animation-delay: -1.6s; }
  .card:active { transform: scale(.95); }
  @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -1.2vmin; } }
  .card .label {
    position: relative; z-index: 2; margin-bottom: 4%; padding: .4em 1em; border-radius: 999px;
    font-size: clamp(22px, 4.6vmin, 56px); font-weight: 800; background: rgba(0,0,0,.28);
    -webkit-text-stroke: .15vmin rgba(0,0,0,.25);
  }

  /* --- Tap Tap Party card --- */
  .party { background: radial-gradient(circle at 50% 42%, #5a2fd1, #24124f 75%); }
  .party .swirl {
    position: absolute; width: 62%; aspect-ratio: 1; top: 8%; left: 19%; border-radius: 50%;
    background: conic-gradient(#ff5f6d, #ffc371, #f9f871, #6bf178, #4ad7ff, #a77bff, #ff7ad9, #ff5f6d);
    animation: spin 6s linear infinite; box-shadow: 0 0 8vmin rgba(255,255,255,.35);
  }
  .party .swirl::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: #2c1667; }
  .party .buddy {
    position: absolute; top: 25%; left: 50%; width: 26%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%;
    background: #ff6fb5; border: .6vmin solid #a3135f; animation: hop 1.2s ease-in-out infinite;
  }
  .party .buddy::before, .party .buddy::after {
    content: ""; position: absolute; top: 28%; width: 26%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 55%, #1d1233 38%, #fff 40%);
  }
  .party .buddy::before { left: 18%; } .party .buddy::after { right: 18%; }
  .party .smile { position: absolute; left: 30%; top: 60%; width: 40%; height: 18%; border-bottom: .8vmin solid #1d1233; border-radius: 0 0 50% 50%; z-index: 1; }
  .party .pop { position: absolute; width: 13%; animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.08,.92); } 50% { transform: translateY(-14%) scale(.95,1.05); } }
  @keyframes twinkle { 0%,100% { transform: scale(.8) rotate(-10deg); opacity: .75; } 50% { transform: scale(1.15) rotate(10deg); opacity: 1; } }

  /* --- Animal Sounds card --- */
  .animals { background: linear-gradient(#5ec8ff 0%, #c9f0ff 52%, #7fd67a 52.5%, #3fa84a 100%); }
  .animals .sun { position: absolute; top: 7%; left: 7%; width: 13%; aspect-ratio: 1; border-radius: 50%; background: #ffd43b; box-shadow: 0 0 0 1.4vmin rgba(255,224,102,.55); }
  .animals .grid { position: absolute; inset: 9% 6% 26% 6%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); place-items: center; }
  .animals .grid img { width: 78%; max-height: 92%; object-fit: contain; animation: hop2 1.1s ease-in-out infinite; filter: drop-shadow(0 .6vmin 0 rgba(0,0,0,.18)); }
  @keyframes hop2 { 0%,100% { transform: translateY(0) scale(1,1); } 20% { transform: translateY(0) scale(1.08,.92); } 50% { transform: translateY(-16%) scale(.96,1.05); } }
  .animals .note { position: absolute; width: 9%; animation: twinkle 1.4s ease-in-out infinite; }

  .foot { position: relative; z-index: 1; font: 13px system-ui, sans-serif; color: rgba(255,255,255,.6); text-align: center; }

  @media (orientation: portrait) {
    .cards { flex-direction: column; align-items: center; }
    .card { width: min(88vw, 60vh); flex: none; }
  }
</style>
</head>

<div class="bubbles" id="bubbles"></div>

  <a class="card party" href="party.html" aria-label="Tap Tap Party">

    <img class="pop" data-art="2b50" style="top:10%;left:9%" alt="">
    <img class="pop" data-art="1f496" style="top:14%;right:9%;animation-delay:-.5s" alt="">
    <img class="pop" data-art="1f3b5" style="top:52%;left:12%;animation-delay:-1s" alt="">
    <img class="pop" data-art="1f3b6" style="top:50%;right:12%;animation-delay:-.3s" alt="">
    <div class="label">Tap Tap Party</div>

  <a class="card animals" href="animals.html" aria-label="Animal Sounds">

    <div class="grid" id="animalGrid"></div>
    <img class="note" data-art="1f3b5" style="top:6%;right:8%" alt="">
    <div class="label">Animal Sounds</div>
  </a>
</div>

  const url = (code) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ART[code]);

  document.querySelectorAll('[data-art]').forEach(im => { im.src = url(im.dataset.art); });

  const grid = document.getElementById('animalGrid');
  ['1f42e', '1f436', '1f981', '1f986', '1f437', '1f431', '1f418', '1f438'].forEach((code, i) => {
    const im = document.createElement('img'); im.src = url(code); im.alt = '';
    im.style.animationDelay = (-i * 0.14) + 's';
    grid.appendChild(im);
  });

  // Rainbow, bobbing title letters
  const title = document.getElementById('title');
  const colors = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa', '#f783ac'];
  title.innerHTML = [...title.textContent].map((ch, i) =>
    ch === ' ' ? ' ' : `<span style="color:${colors[i % colors.length]};animation-delay:${-i * 0.12}s">${ch}</span>`).join('');

  // Drifting bubbles
  const box = document.getElementById('bubbles');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'), size = 3 + Math.random() * 8;
    s.style.cssText = `left:${Math.random() * 100}vw;width:${size}vmin;height:${size}vmin;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s`;
    box.appendChild(s);
  }

  // Block pinch-zoom / long-press menus without breaking the links
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (e.cancelable && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
